<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="Courier New, Courier, monospace">
  <!-- divider between the two scenarios -->
  <line x1="330" y1="24" x2="330" y2="276" stroke="#c0c0c0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== LEFT: chains and branches (OK) ===== -->
  <text x="150" y="30" text-anchor="middle" font-size="13" fill="#000" stroke="none">Daisy chain</text>
  <!-- green check -->
  <polyline points="268,22 274,30 288,12" stroke="#008000" stroke-width="3"/>

  <!-- top switch -->
  <rect x="120" y="54" width="90" height="36" rx="6"/>
  <text x="165" y="76" text-anchor="middle" font-size="12" fill="#000" stroke="none">Switch</text>

  <!-- branch out to two switches -->
  <rect x="40" y="156" width="90" height="36" rx="6"/>
  <text x="85" y="178" text-anchor="middle" font-size="12" fill="#000" stroke="none">Switch</text>

  <rect x="210" y="156" width="90" height="36" rx="6"/>
  <text x="255" y="178" text-anchor="middle" font-size="12" fill="#000" stroke="none">Switch</text>

  <!-- chain continues off one branch -->
  <rect x="40" y="238" width="90" height="36" rx="6"/>
  <text x="85" y="260" text-anchor="middle" font-size="12" fill="#000" stroke="none">Switch</text>

  <!-- branching links (a tree, no loop): two separate wires to each switch -->
  <line x1="140" y1="90" x2="85" y2="156"/>
  <line x1="190" y1="90" x2="255" y2="156"/>
  <line x1="85" y1="192" x2="85" y2="238"/>

  <!-- ===== RIGHT: loop (NEVER) ===== -->
  <text x="495" y="30" text-anchor="middle" font-size="13" fill="#000" stroke="none">Loop</text>
  <!-- red X, mirroring the checkmark on the left -->
  <line x1="614" y1="12" x2="630" y2="28" stroke="#cc0000" stroke-width="3"/>
  <line x1="630" y1="12" x2="614" y2="28" stroke="#cc0000" stroke-width="3"/>

  <!-- three switches in a triangle -->
  <rect x="370" y="60" width="90" height="36" rx="6"/>
  <text x="415" y="82" text-anchor="middle" font-size="12" fill="#000" stroke="none">Switch</text>

  <rect x="550" y="60" width="90" height="36" rx="6"/>
  <text x="595" y="82" text-anchor="middle" font-size="12" fill="#000" stroke="none">Switch</text>

  <rect x="460" y="200" width="90" height="36" rx="6"/>
  <text x="505" y="222" text-anchor="middle" font-size="12" fill="#000" stroke="none">Switch</text>

  <!-- the three links close a loop: drawn in red -->
  <line x1="460" y1="78" x2="550" y2="78" stroke="#cc0000"/>
  <line x1="600" y1="96" x2="530" y2="200" stroke="#cc0000"/>
  <line x1="480" y1="200" x2="410" y2="96" stroke="#cc0000"/>
</svg>
