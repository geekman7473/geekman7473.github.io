<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 225" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="Courier New, Courier, monospace">
  <!-- Player 1's PC -->
  <rect x="24" y="28" width="64" height="42" rx="4"/>
  <line x1="56" y1="70" x2="56" y2="80"/>
  <line x1="40" y1="82" x2="72" y2="82"/>
  <text x="56" y="102" text-anchor="middle" font-size="13" fill="#000" stroke="none">Player 1's PC</text>
  <!-- Player 2's PC -->
  <rect x="24" y="138" width="64" height="42" rx="4"/>
  <line x1="56" y1="180" x2="56" y2="190"/>
  <line x1="40" y1="192" x2="72" y2="192"/>
  <text x="56" y="212" text-anchor="middle" font-size="13" fill="#000" stroke="none">Player 2's PC</text>
  <!-- ethernet runs to the switch -->
  <polyline points="88,49 150,49 150,105 220,105"/>
  <polyline points="88,159 150,159 150,125 220,125"/>
  <!-- Switch -->
  <rect x="220" y="93" width="110" height="44" rx="6"/>
  <rect x="232" y="118" width="10" height="8"/>
  <rect x="250" y="118" width="10" height="8"/>
  <rect x="268" y="118" width="10" height="8"/>
  <rect x="286" y="118" width="10" height="8"/>
  <rect x="304" y="118" width="10" height="8"/>
  <text x="275" y="157" text-anchor="middle" font-size="13" fill="#000" stroke="none">Switch</text>
  <!-- switch to router -->
  <line x1="330" y1="115" x2="420" y2="115"/>
  <!-- Router -->
  <rect x="420" y="93" width="100" height="44" rx="6"/>
  <line x1="440" y1="93" x2="432" y2="70"/>
  <line x1="500" y1="93" x2="508" y2="70"/>
  <text x="470" y="157" text-anchor="middle" font-size="13" fill="#000" stroke="none">Router</text>
  <!-- router to the internet -->
  <line x1="520" y1="115" x2="552" y2="115"/>
  <!-- The Internet (cloud) -->
  <path transform="translate(542,80) scale(5.6)" stroke-width="0.36" d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383z"/>
  <text x="587" y="172" text-anchor="middle" font-size="13" fill="#000" stroke="none">The Internet</text>
</svg>
