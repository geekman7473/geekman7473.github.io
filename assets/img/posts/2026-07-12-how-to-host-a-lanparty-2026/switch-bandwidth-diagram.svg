<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 362" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="Courier New, Courier, monospace">

  <!-- ===== TOP: four users on the same switch ===== -->
  <text x="30" y="26" font-size="14" fill="#000" stroke="none">Same switch</text>

  <!-- the single switch -->
  <rect x="285" y="66" width="90" height="48" rx="6"/>
  <text x="330" y="95" text-anchor="middle" font-size="12" fill="#000" stroke="none">Switch</text>

  <!-- PCs on the left -->
  <rect x="44" y="44" width="64" height="34" rx="4"/>
  <text x="76" y="66" text-anchor="middle" font-size="11" fill="#000" stroke="none">PC</text>
  <rect x="44" y="118" width="64" height="34" rx="4"/>
  <text x="76" y="140" text-anchor="middle" font-size="11" fill="#000" stroke="none">PC</text>

  <!-- PCs on the right -->
  <rect x="552" y="44" width="64" height="34" rx="4"/>
  <text x="584" y="66" text-anchor="middle" font-size="11" fill="#000" stroke="none">PC</text>
  <rect x="552" y="118" width="64" height="34" rx="4"/>
  <text x="584" y="140" text-anchor="middle" font-size="11" fill="#000" stroke="none">PC</text>

  <!-- every PC has its own 1 Gbps link into the switch -->
  <line x1="108" y1="61" x2="285" y2="82"/>
  <line x1="108" y1="135" x2="285" y2="98"/>
  <line x1="552" y1="61" x2="375" y2="82"/>
  <line x1="552" y1="135" x2="375" y2="98"/>
  <text x="196" y="62" text-anchor="middle" font-size="10" fill="#555" stroke="none">1 Gbps</text>
  <text x="196" y="132" text-anchor="middle" font-size="10" fill="#555" stroke="none">1 Gbps</text>
  <text x="464" y="62" text-anchor="middle" font-size="10" fill="#555" stroke="none">1 Gbps</text>
  <text x="464" y="132" text-anchor="middle" font-size="10" fill="#555" stroke="none">1 Gbps</text>

  <text x="330" y="162" text-anchor="middle" font-size="13" fill="#008000" stroke="none">Everyone gets the full 1 Gbps all at once</text>

  <!-- divider between the two scenarios -->
  <line x1="24" y1="180" x2="636" y2="180" stroke="#c0c0c0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== BOTTOM: users split across two switches ===== -->
  <text x="30" y="208" font-size="14" fill="#000" stroke="none">Two switches</text>

  <rect x="175" y="252" width="90" height="44" rx="6"/>
  <text x="220" y="279" text-anchor="middle" font-size="11" fill="#000" stroke="none">Switch 1</text>

  <rect x="395" y="252" width="90" height="44" rx="6"/>
  <text x="440" y="279" text-anchor="middle" font-size="11" fill="#000" stroke="none">Switch 2</text>

  <!-- shared uplink: the bottleneck -->
  <line x1="265" y1="274" x2="395" y2="274" stroke="#cc0000" stroke-width="3"/>
  <text x="330" y="266" text-anchor="middle" font-size="11" fill="#cc0000" stroke="none">0.25 Gbps each</text>

  <!-- PCs on switch 1 -->
  <rect x="44" y="230" width="64" height="34" rx="4"/>
  <text x="76" y="252" text-anchor="middle" font-size="11" fill="#000" stroke="none">PC</text>
  <rect x="44" y="304" width="64" height="34" rx="4"/>
  <text x="76" y="326" text-anchor="middle" font-size="11" fill="#000" stroke="none">PC</text>
  <line x1="108" y1="247" x2="175" y2="262"/>
  <line x1="108" y1="321" x2="175" y2="286"/>

  <!-- PCs on switch 2 -->
  <rect x="552" y="230" width="64" height="34" rx="4"/>
  <text x="584" y="252" text-anchor="middle" font-size="11" fill="#000" stroke="none">PC</text>
  <rect x="552" y="304" width="64" height="34" rx="4"/>
  <text x="584" y="326" text-anchor="middle" font-size="11" fill="#000" stroke="none">PC</text>
  <line x1="552" y1="247" x2="485" y2="262"/>
  <line x1="552" y1="321" x2="485" y2="286"/>

  <!-- access-link labels (all 1 Gbps) -->
  <text x="150" y="242" text-anchor="middle" font-size="10" fill="#555" stroke="none">1 Gbps</text>
  <text x="150" y="325" text-anchor="middle" font-size="10" fill="#555" stroke="none">1 Gbps</text>
  <text x="510" y="242" text-anchor="middle" font-size="10" fill="#555" stroke="none">1 Gbps</text>
  <text x="510" y="325" text-anchor="middle" font-size="10" fill="#555" stroke="none">1 Gbps</text>

  <text x="330" y="356" text-anchor="middle" font-size="13" fill="#cc0000" stroke="none">All 4 machines split the cable between the two switches.</text>
</svg>
